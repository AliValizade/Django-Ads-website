{% extends "_base.html" %}

{% block page_title %}Login{% endblock page_title %}

{% block content %}
    {% if user.is_authenticated %}
        <p>Welcome {{ user.username }} | <a href="{% url "logout" %}">Logout</a></p>
    {% else %}
        <form action="" method="POST"> 
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
    {% endif %}
{% endblock content %}
